<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài 3 - Quản lý công việc</title><link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js" defer></script>
  <script src="bai3.js" defer></script>
</head>
<body>
  <main id="app" class="shell narrow" v-cloak>
    <a class="back-link" href="index.html">← Danh sách bài tập</a>
    <p class="eyebrow">Bài 3 · Quản lý công việc cá nhân</p>
    <h1>Việc cần làm hôm nay</h1>
    <section class="panel">
      <form class="add-row" @submit.prevent="addTask">
        <label for="new-task" class="sr-only">Tên công việc mới</label>
        <input id="new-task" v-model.trim="newTask" type="text" placeholder="Nhập công việc mới...">
        <button type="submit">Thêm</button>
      </form>
      <div class="stats"><span>Tổng số: <strong>{{ totalTasks }}</strong></span><span>Chưa hoàn thành: <strong>{{ remainingTasks }}</strong></span></div>
      <div class="filters" role="group" aria-label="Lọc công việc">
        <button v-for="option in filters" :key="option.value" type="button" class="filter-button" :class="{ selected: filter === option.value }" :aria-pressed="filter === option.value" @click="filter = option.value">{{ option.label }}</button>
      </div>
      <ul v-if="filteredTasks.length" class="task-list">
        <li v-for="task in filteredTasks" :key="task.id" class="task-item">
          <label class="task-label"><input type="checkbox" v-model="task.completed"><span :class="{ completed: task.completed }">{{ task.name }}</span></label>
          <button type="button" class="delete-button" @click="deleteTask(task.id)" :aria-label="'Xóa ' + task.name">Xóa</button>
        </li>
      </ul>
      <p v-else class="empty-state">{{ tasks.length === 0 ? 'Chưa có công việc nào. Hãy thêm việc đầu tiên!' : 'Không có công việc phù hợp với bộ lọc này.' }}</p>
      <button type="button" class="secondary clear-button" @click="clearCompleted" :disabled="totalTasks === remainingTasks">Xóa các việc đã hoàn thành</button>
    </section>
  </main>
</body>
</html>
